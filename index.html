<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Index</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      height: 100vh;
      background: radial-gradient(circle at top, #0b0b0b, #000);
      color: #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 50px 60px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      box-shadow: 0 0 60px rgba(0, 255, 204, 0.15);
      position: relative;
      z-index: 2;
      animation: float 6s ease-in-out infinite;
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 12px;
      color: #00ffcc;
      letter-spacing: 1px;
    }

    p {
      font-size: 1.1rem;
      opacity: 0.85;
      margin-bottom: 28px;
    }

    a {
      display: inline-block;
      padding: 12px 26px;
      border-radius: 8px;
      text-decoration: none;
      color: #0a0a0a;
      background: #00ffcc;
      font-weight: 600;
      transition: 0.25s ease;
    }

    a:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0, 255, 204, 0.4);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* animated background dots */
    canvas {
      position: absolute;
      inset: 0;
      z-index: 1;
    }
  </style>
</head>

<body>

  <canvas id="bg"></canvas>

  <div class="container">
    <h1 id="glitch">najil</h1>
    <p>Simple. Animated. Cyber-clean.</p>
    <a href="#">Enter</a>
  </div>
